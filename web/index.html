<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIXiaoMi Glass</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">G</div>
        <div>
          <div class="brand-title">AIXiaoMi Glass</div>
          <div class="brand-subtitle">朋友圈智能相册运行透视</div>
        </div>
      </div>

      <div class="filter">
        <label for="user-filter">用户 ID</label>
        <div class="input-row">
          <input id="user-filter" placeholder="全部用户">
          <button id="refresh-btn" title="刷新">刷新</button>
        </div>
      </div>

      <div class="flow-list-head">
        <span>流程</span>
        <span id="flow-count">0</span>
      </div>
      <div id="flow-list" class="flow-list"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">运行透视</div>
          <h1 id="flow-title">选择一个相册流程</h1>
        </div>
        <div class="status-panel">
          <div>
            <span class="muted">刷新时间</span>
            <strong id="refresh-state">每 3 秒</strong>
          </div>
          <div>
            <span class="muted">整体状态</span>
            <strong id="overall-state">等待</strong>
          </div>
        </div>
      </header>

      <section class="glass-wall">
        <div class="machine">
          <div id="stage-track" class="stage-track"></div>
        </div>
      </section>

      <section class="grid">
        <div class="panel span-2">
          <div class="panel-head">
            <h2>照片与预处理</h2>
            <span id="photo-summary" class="chip">-</span>
          </div>
          <div id="photo-grid" class="photo-grid"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>判断与生成</h2>
          </div>
          <div id="decision-box" class="kv-list"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>扣费与推送</h2>
          </div>
          <div id="billing-box" class="kv-list"></div>
        </div>

        <div class="panel span-2">
          <div class="panel-head">
            <h2>最近日志</h2>
            <span class="chip">按当前流程过滤</span>
          </div>
          <pre id="log-box" class="log-box"></pre>
        </div>
      </section>
    </main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
